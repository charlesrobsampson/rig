version: "3"

vars:
  BIN: rig
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  build:egress:
    desc: Build the static linux egress proxy binaries that rig embeds
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o internal/egress/embedded/rig-egress-linux-amd64 ./cmd/rig-egress
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o internal/egress/embedded/rig-egress-linux-arm64 ./cmd/rig-egress

  build:
    desc: Build ./rig (with the egress proxy embedded)
    deps: [build:egress]
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BIN}} ./cmd/rig

  build:fakeagent:
    desc: Build bin/fakeagent, the scriptable stand-in for an agent used in integration tests
    cmds:
      - go build -o bin/fakeagent ./tools/fakeagent

  test:
    desc: Default tests (offline, no build tags)
    cmds:
      - go test ./...

  test:race:
    desc: Default tests with the race detector
    cmds:
      - go test -race ./...

  test:integration:
    desc: Tests tagged integration (real tmux/Herdr); pass packages after --
    cmds:
      - go test -tags integration {{.CLI_ARGS | default "./..."}}

  test:docker:
    desc: Tests tagged docker (real Docker); pass packages after --
    cmds:
      - go test -tags docker {{.CLI_ARGS | default "./..."}}

  test:llm:
    desc: Tests tagged llm (local Ollama); pass packages after --
    cmds:
      - go test -tags llm {{.CLI_ARGS | default "./..."}}

  test:linux:
    desc: Run the default tests on Linux in a container (cross-compiled; needs Docker); pass packages after --
    cmds:
      - go run ./tools/linuxtest {{.CLI_ARGS | default "./..."}}

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is unformatted
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  check:
    desc: Pre-commit gate (fmt:check, vet, test)
    cmds:
      - task: fmt:check
      - task: vet
      - task: test

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  clean:
    desc: Remove build output
    cmds:
      - rm -f {{.BIN}}
      - rm -rf dist bin

  release:
    desc: Build release archives for macOS and Linux (arm64, amd64) into dist/, with SHA256SUMS
    deps: [build:egress]
    cmds:
      - rm -rf dist && mkdir -p dist
      - |
        set -e
        for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
          os=${target%/*}; arch=${target#*/}
          name=rig_{{.VERSION}}_${os}_${arch}
          mkdir -p dist/$name
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/$name/rig ./cmd/rig
          cp README.md dist/$name/
          for f in LICENSE LICENSE.md; do [ -f $f ] && cp $f dist/$name/ || true; done
          tar -C dist -czf dist/$name.tar.gz $name
          rm -rf dist/$name
        done
        cd dist
        if command -v sha256sum >/dev/null; then sha256sum *.tar.gz > SHA256SUMS; else shasum -a 256 *.tar.gz > SHA256SUMS; fi
        cat SHA256SUMS
